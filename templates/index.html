<!DOCTYPE html>
<html>
<head>
    <title>CS 121 Search Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #003366;
            text-align: center;
        }
        .search-box {
            margin: 40px 0;
            text-align: center;
        }
        input[type="text"] {
            width: 500px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005599;
        }
        .error {
            color: red;
            text-align: center;
        }
        .info {
            text-align: center;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>ICS Search Engine</h1>

    <div class="search-box">
        <form action="/search" method="get">
            <input type="text" name="q" placeholder="Enter your search query..." autofocus>
            <button type="submit">Search</button>
        </form>
    </div>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <div class="info">
        <p>Search across 55,393 ICS documents</p>
        <p>Powered by TF-IDF ranking with zone-based scoring</p>
    </div>
</body>
</html>
